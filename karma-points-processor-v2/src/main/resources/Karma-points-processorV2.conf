include "base-config.conf"

kafka {
  input.topic = "karma.points.unified.v2.event"
  failed.topic = "karma.points.unified.v2.failed"
  groupId = "dev-karma-points-processor-v2-group"
}

task {
  consumer.parallelism = 1
  parallelism = 1
}

cassandra {
  sunbird.keyspace = "sunbird"
  sunbird_courses.keyspace = "sunbird_courses"
  content_hierarchy.keyspace = "dev_hierarchy_store"
  user_karma_points.table = "user_karma_points"
  user_karma_points_credit_lookup.table = "user_karma_points_credit_lookup"
  content_hierarchy.table = "content_hierarchy"
  user_enrolments.table = "user_enrolments"
  user.table = "user"
  user_karma_points_summary.table = "user_karma_points_summary"
  user_assessment_data.table = "user_assessment_data"
  course_batch.table = "course_batch"
  user_karma_coin_lookup.table = "user_karma_coin_lookup"
  user_karma_coin_wallet.table = "user_karma_coin_wallet"
  user_karma_coin_monthly_summary.table = "user_karma_coin_monthly_summary"
  user_karma_coin_transactions.table = "user_karma_coin_transactions"
}

service {
  cbplan.basePath = "http://192.168.0.70:7002/"
  cbplan.v2.basePath = "http://192.168.0.70:7002/"
  event.read = "http://localhost:6004/event/v4/read/"
}

karmapoints {
  acbpQuotaKarmaPoints = 5
  courseCompletionQuotaKarmaPoints = 5
  learningPathwayCompletionQuotaKarmaPoints = 25
  assessmentQuotaKarmaPoints = 5
  ratingQuotaKarmaPoints = 2
  firstLoginQuotaKarmaPoints = 5
  firstEnrolmentQuotaKarmaPoints = 5
  nonAcbpCourseQuota = 4
  eventQuotaKarmaPoints = 5
  enableCapping = false
}

karmaCoin {
  # POINTS_CONVERSION monthly cap - Karma Points that can be converted to Karma Coins per calendar month.
  pointsConversion {
    monthlyLimit = 300
  }

  redis {
    # Karma Coin wallet cache TTL (RedisUtil.setKarmaCoinWallet).
    cacheTtlSeconds = 3600
    # First-level request-dedup claim TTL, in front of Cassandra (RedisUtil.claimKarmaCoinRequest).
    requestClaimTtlSeconds = 14400
    # Independent per-flow switches for the Redis request-dedup/claim step only - Cassandra
    # LWT/claimOrResume always runs regardless of these.
    pointsConversionDedupEnabled = true
    coinsRedemptionDedupEnabled  = true
  }
}

redis {
  database {
    karmaPointCache.id = 0
  }
  host = localhost
  port = 6379
  cache.ttl.seconds = 259200
}

metrics {
  enabled = true
  reporter = "slf4j"
}
